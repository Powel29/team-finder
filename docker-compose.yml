# Local dev services: `docker compose up -d`
#
# Without Docker (Debian/Ubuntu):
#   sudo apt-get install -y postgresql redis-server
#   sudo service postgresql start && redis-server --daemonize yes
#   sudo -u postgres psql -c "CREATE USER teamfinder WITH PASSWORD 'teamfinder' SUPERUSER;"
#   sudo -u postgres createdb -O teamfinder teamfinder && sudo -u postgres createdb -O teamfinder teamfinder_test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamfinder
      POSTGRES_PASSWORD: teamfinder
      POSTGRES_DB: teamfinder
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  pgdata:
