name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamfinder
          POSTGRES_PASSWORD: teamfinder
          POSTGRES_DB: teamfinder_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U teamfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://teamfinder:teamfinder@localhost:5432/teamfinder_test
      TEST_DATABASE_URL: postgresql://teamfinder:teamfinder@localhost:5432/teamfinder_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm run lint
      - run: npm test
      - run: npm run build
